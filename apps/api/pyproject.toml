[project]
name = "avalab-api"
version = "0.1.0"
description = "AvaLab FastAPI backend: audio ingest, real codecs and ML tools."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  # PyTorch 2.2.2 is the last Intel-macOS wheel; it needs numpy 1.x.
  'numpy>=2.5.4; sys_platform != "darwin" or platform_machine != "x86_64"',
  'scipy>=1.18.1; sys_platform != "darwin" or platform_machine != "x86_64"',
  'numpy>=1.26,<2; sys_platform == "darwin" and platform_machine == "x86_64"',
  'scipy>=1.16,<1.17; sys_platform == "darwin" and platform_machine == "x86_64"',
  "librosa>=0.11.0",
  # llvmlite 0.50 has no macOS x86_64 wheel; 0.44 (numba 0.61) does.
  # Restrict the pin to Intel macOS so Linux resolves a NumPy-2.5-compatible numba.
  'numba>=0.61,<0.62; sys_platform == "darwin" and platform_machine == "x86_64"',
]

[project.optional-dependencies]
ml = [
  'torch>=2.6; sys_platform != "darwin" or platform_machine != "x86_64"',
  'torchaudio>=2.6; sys_platform != "darwin" or platform_machine != "x86_64"',
  'torch>=2.1,<2.3; sys_platform == "darwin" and platform_machine == "x86_64"',
  'torchaudio>=2.1,<2.3; sys_platform == "darwin" and platform_machine == "x86_64"',
  "transformers>=4.57,<5",
  "demucs==4.1.0",
  "sherpa-onnx==2.0.1",
  "audiosronnx==0.0.1",
  'onnxruntime>=1.18; sys_platform != "darwin" or platform_machine != "x86_64"',
  'onnxruntime>=1.18,<1.24; sys_platform == "darwin" and platform_machine == "x86_64"',
  "huggingface-hub>=0.24",
  "soundfile>=0.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avalab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ml: real model tests, gated by AVALAB_RUN_ML_TESTS=1",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
