[project]
name = "avalab-demo-clips"
version = "0.1.0"
description = "Deterministic generator for AvaLab bundled demo audio clips (self-generated, CC0)."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
